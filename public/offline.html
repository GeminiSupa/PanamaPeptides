<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Sin conexión | Panama Peptides</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f7f7f7; background: #050505; }
      main { width: min(100%, 520px); padding: 32px; text-align: center; background: #151515; border: 1px solid #353535; border-radius: 18px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 10px; font-size: 1.8rem; }
      p { margin: 0 0 24px; color: #d2d2d2; line-height: 1.55; }
      button { min-height: 46px; padding: 0 20px; color: #fff; background: #a51220; border: 1px solid #d44753; border-radius: 9px; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover, button:focus-visible { color: #fff; background: #c21d2c; outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Panama Peptides" />
      <h1>Estás sin conexión</h1>
      <p>Vuelve a conectarte para ver inventario, precios y datos actualizados. Your catalog will return when the connection is restored.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
